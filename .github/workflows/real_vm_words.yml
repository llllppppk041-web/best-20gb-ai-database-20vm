name: Real-VM-Dataset-1000-Words-Dumper
on:
  workflow_dispatch:
jobs:
  stream-real-dataset-words:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        vm_id: [1, 2, 3, 4, 5]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyArrow & HuggingFace Hub
        run: pip install -q huggingface_hub pyarrow requests
      - name: Download & Print Real Dataset Words on GitHub VM
        env:
          VM_ID: ${{ matrix.vm_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, json, pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download

          vm_id = int(os.environ.get("VM_ID", 1))
          hf_tok = os.environ.get("HF_TOKEN") or None
          repos = [
              "saidutta69/claude-mythos-distilled-25k-clean",
              "ansulev/claude-mythos-distilled-25k",
              "MoreThought/Fable-5.1-Max-Reasoning-Filtered-10000x",
              "chenbhao/Versper-V1-Evo-ORPO-GPT5.5-Think-Recursive-25k",
              "Bialy17/databricks-dolly-1k-GPT5.5"
          ]
          target_repo = repos[(vm_id - 1) % len(repos)]
          api = HfApi(token=hf_tok)
          files = [f for f in api.list_repo_files(target_repo, repo_type="dataset") if f.endswith((".parquet", ".jsonl"))]
          print(f"=== [GITHUB VM #{vm_id} REAL DATA STREAM FROM {target_repo}] ===", flush=True)

          words_printed = 0
          for fname in files[:1]:
              local_f = hf_hub_download(repo_id=target_repo, filename=fname, repo_type="dataset", token=hf_tok)
              if fname.endswith(".parquet"):
                  pf = pq.ParquetFile(local_f)
                  for batch in pf.iter_batches(batch_size=32):
                      for row in batch.to_pylist():
                          row_text = json.dumps(row, ensure_ascii=False)
                          print(f"[VM#{vm_id}_ROW]: {row_text}", flush=True)
                          words_printed += len(row_text.split())
                          if words_printed >= 1500:
                              break
                      if words_printed >= 1500:
                          break
              else:
                  with open(local_f, "r", encoding="utf-8", errors="ignore") as f:
                      for line in f:
                          print(f"[VM#{vm_id}_ROW]: {line.strip()}", flush=True)
                          words_printed += len(line.split())
                          if words_printed >= 1500:
                              break
          print(f"=== [GITHUB VM #{vm_id} FINISHED STREAMING {words_printed} REAL WORDS] ===", flush=True)
          EOF
